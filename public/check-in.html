<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Attendee Check-In</title>
</head>
<body>
  <main>
    <h1>Attendee Check-In</h1>

    <form action="/check-in" method="post">
      <label for="name">Name</label>
      <input id="name" name="name" type="text" required>

      <lable for = "studentNumber">Student Number</lable>
      <input id ="studentNumber" name="studentNumber" type="text" required>

      <label for="email">Email</label>
      <input id="email" name="email" type="email" required>

      <button type="submit">Check in</button>
    </form>

    <p><a href="/">Back to welcome page</a></p>
  </main>
</body>
</html>
